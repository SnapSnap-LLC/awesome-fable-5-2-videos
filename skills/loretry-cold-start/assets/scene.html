<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1280,height=720"><title>How a circle draws a wave</title><style>*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;margin:0}body{font:22px/1.4 -apple-system,BlinkMacSystemFont,Arial,sans-serif}main{position:absolute;inset:0;overflow:hidden}p,h1,h2{margin:0}h1{font-size:80px;line-height:1.08;letter-spacing:-.07em;white-space:pre-line}small{font-size:16px}svg{display:block} [data-beat]{position:absolute;opacity:0;will-change:opacity,translate}
:root{--paper:#e7ebdf;--ink:#25362b;--accent:#a15d27;--guide:#aab7a6}
main{background:var(--paper);color:var(--ink)}
header{position:absolute;left:66px;right:66px;top:40px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #25362b43;padding-bottom:14px}
.name{font:700 30px/1 Georgia,serif;letter-spacing:-.04em;position:relative}.name::after{content:'';position:absolute;bottom:-4px;left:0;width:62%;height:2px;background:var(--accent)}
header small{font-size:14px;letter-spacing:.11em}.text{left:65px;top:159px;width:425px}
h1{font-family:Georgia,serif;font-size:63px;line-height:1.13;letter-spacing:-.045em}
.eyebrow{font-size:16px;color:#7a431e;margin-bottom:16px;font-weight:700}
.text p:last-child{font-size:22px;margin-top:23px;max-width:395px}
#diagram{position:absolute;left:478px;top:168px;width:734px;height:393px}
#diagram text{font:18px -apple-system,BlinkMacSystemFont,sans-serif;fill:var(--ink)}
#diagram .formula{font:italic 24px Georgia,serif;fill:#7a431e}
#arc,#wave{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
#track{fill:none;stroke:var(--guide);stroke-width:1.5;stroke-dasharray:5 7}
.axis{stroke:#536759;stroke-width:1.4}.guide{stroke:#809284;stroke-width:1;stroke-dasharray:4 6}
#radius{stroke:var(--ink);stroke-width:3}#projection{stroke:var(--accent);stroke-width:2;stroke-dasharray:6 7}
.dot{fill:var(--accent);stroke:var(--paper);stroke-width:2.5}.dot.core{fill:var(--ink)}
footer{position:absolute;bottom:43px;left:66px;right:66px;border-top:1px solid #25362b43;padding-top:14px;display:flex;justify-content:space-between;font-size:15px;color:#435b4a}
</style></head>
<body><main>
<header><span class="name">Loretry</span><small data-copy="label"></small></header>
<div class="text" data-beat><p class="eyebrow" data-copy="hookTag"></p><h1 data-copy="hook"></h1><p data-copy="question"></p></div>
<div class="text" data-beat><p class="eyebrow" data-copy="showTag"></p><h1 data-copy="show"></h1><p data-copy="explain"></p></div>
<div class="text" data-beat><p class="eyebrow" data-copy="resultTag"></p><h1 data-copy="result"></h1><p data-copy="takeaway"></p></div>
<svg id="diagram" viewBox="0 0 734 393" role="img" aria-label="A point on a unit circle projects its height onto a plot. The trace draws a sine wave as the angle increases.">
  <g class="axis"><path d="M14 196H268M140 64V326"/><path d="M300 196H696m-374-137v274"/><path d="M440 190v12m118-12v12m118-12v12"/></g>
  <circle cx="140" cy="196" r="105" fill="none" stroke="#6f8374" stroke-width="1.5"/>
  <path class="guide" d="M322 91H682m-360 210H682"/>
  <path id="track"/><path id="arc"/>
  <line id="radius" x1="140" y1="196"/>
  <line id="projection"/>
  <path id="wave"/>
  <circle id="circle-dot" class="dot core" r="7"/>
  <circle id="plot-dot" class="dot" r="7"/>
  <text x="77" y="356" data-copy="circle"></text><text x="362" y="356" data-copy="chart"></text>
  <text x="287" y="96">+1</text><text x="297" y="202">0</text><text x="286" y="305">−1</text>
  <text x="312" y="227">0</text><text x="430" y="227">2π/3</text><text x="545" y="227">4π/3</text><text x="665" y="227">2π</text>
  <text x="544" y="50" class="formula">y = sin θ</text>
</svg>
<footer><span data-copy="credit"></span><span>0 → 2π</span></footer>
</main><script>const one = s => document.querySelector(s);
const all = s => [...document.querySelectorAll(s)];
const clamp = x => Math.min(1, Math.max(0, x));
const ramp = (t,a,b) => clamp((t-a)/(b-a));
const ease = x => x*x*(3-2*x);
const smooth = (t,a,b) => ease(ramp(t,a,b));
function swap(t, starts){
  all('[data-beat]').forEach((el,i)=>{
    const incoming=i===0 ? 1 : smooth(t,starts[i],starts[i]+.38);
    const outgoing=i===starts.length-1 ? 1 : 1-smooth(t,starts[i+1]-.38,starts[i+1]);
    el.style.opacity=incoming*outgoing;
    el.style.translate='0 '+(12*(1-incoming)-7*(1-outgoing))+'px';
  });
}
function bind(copy){for (const el of all('[data-copy]')) el.textContent=copy[el.dataset.copy];}

// The diagram models a unit-circle example. Replace geometry as well as copy for another concept.
const copy={
  label:'MATH IN MOTION',hookTag:'01 / THE QUESTION',hook:'How does a\ncircle draw\na wave?',question:'Start with one point on the unit circle.',
  showTag:'02 / THE MAPPING',show:'Plot the\npoint’s height.',explain:'Move right as the angle grows. Copy the height straight across.',
  resultTag:'03 / THE RESULT',result:'One turn,\none wave.',takeaway:'At 2π the point is back where it started. The curve has traced one complete period.',
  circle:'Unit circle',chart:'Angle →',credit:'Unit circle and sine'
};
bind(copy);
const tau=Math.PI*2;
const cy=196;
const r=105;
const point=(el,x,y)=>{el.setAttribute('cx',x);el.setAttribute('cy',y);};
const plotX=p=>322+p*354;
const plotY=a=>cy-r*Math.sin(a);
function path(fn,until,count=80){
  return Array.from({length:count+1},(_,i)=>{const [x,y]=fn(until*i/count);return (i===0?'M':'L')+x.toFixed(2)+' '+y.toFixed(2);}).join(' ');
}
one('#track').setAttribute('d',path(p=>[plotX(p),plotY(tau*p)],1));
const duration=19;
window.film={duration,frame(t){
  swap(t,[0,4.2,14.5]);
  const progress=.18*smooth(t,1.55,4.2)+.09*smooth(t,4.75,6.2)+.73*ramp(t,6.7,14.2);
  const a=progress*tau;
  const y=plotY(a);
  const x=140+r*Math.cos(a);
  const plot=plotX(progress);
  const across=smooth(t,3.45,4.85);
  const line=one('#projection');
  line.setAttribute('x1',x);line.setAttribute('y1',y);
  line.setAttribute('x2',x+(plot-x)*across);line.setAttribute('y2',y);
  line.style.opacity=(smooth(t,3.1,3.48)*(1-.72*smooth(t,14.6,15.75)));
  one('#radius').setAttribute('x2',x);one('#radius').setAttribute('y2',y);
  point(one('#circle-dot'),x,y);
  point(one('#plot-dot'),plot,y);
  one('#plot-dot').style.opacity=smooth(t,4.55,4.9);
  one('#arc').setAttribute('d',path(p=>[140+33*Math.cos(tau*p),196-33*Math.sin(tau*p)],progress));
  one('#wave').setAttribute('d',path(p=>[plotX(p),plotY(tau*p)],progress));
  one('#wave').style.opacity=smooth(t,4.55,4.95);
  one('#track').style.opacity=.4*smooth(t,4.55,4.95)*(1-smooth(t,12.7,14.2));
}};

window.film.frame(0);
</script></body></html>
